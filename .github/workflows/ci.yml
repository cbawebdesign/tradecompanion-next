name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      # `next build` type-checks every file. That is the real gate here —
      # most regressions in this repo have been type/shape errors that this
      # catches and a visual review does not.
      - run: npm run build
