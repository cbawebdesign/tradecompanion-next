name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `next build` type-checks every file. That is the real gate here —
      # most regressions in this repo have been type/shape errors that this
      # catches and a visual review does not.
      #
      # No lint step: `npm run lint` is a stub. There is no ESLint config and
      # no eslint dependency, so `next lint` drops into an interactive setup
      # prompt and fails in CI. Adding ESLint properly is worth doing, but as
      # its own change — turning it on cold would flag a lot of existing code
      # and block every PR until that is dealt with.
      - run: npm run build
